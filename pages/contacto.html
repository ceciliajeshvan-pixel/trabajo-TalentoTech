<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css" />
    <title>Contacto</title>
</head>

<body>
    <header>
        <div class="div-logo"><a class="logo" href="../index.html">Lulubel</a></div>

        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contacto">
            <h1 class="titulo-contacto text-secondary">Contactanos</h1>
            <form class="form-contacto" action="" method="POST">
                <div class="grupo-input">
                    <label for="email"> Your email: </label>
                    <input id="email" type="email" name="email" />
                </div>

                <div class="grupo-input">
                    <label for="mensaje"> Your message: </label>
                    <textarea id="mensaje" name="message"></textarea>
                </div>
                
                <button class="btn bg-secondary text-dark" type="submit">Send</button>
            </form>
        </section>
    </main>
    <footer>
        <p>todos los derechos reservados @lulubel2026</p>
        <nav>
            <ul class="footer-list">
                <li><a href="https://whatsapp.com" target="_blank"><i class="fa-brands fa-whatsapp"></i></a></li>
                <li><a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
